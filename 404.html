<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Bakery</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141009">
<link rel="icon" type="image/svg+xml" href="/bakery/favicon.svg">
<style>
:root{--bg:#141009;--card:#20170e;--line:#352717;--cream:#f4e8d3;--muted:#c3ab86;--ember:#e8932f;--hot:#ffb04d;--serif:Georgia,'Times New Roman',serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--cream);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.6;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:48px 32px;max-width:420px}
.eyebrow{font-family:ui-monospace,Menlo,monospace;font-size:.68rem;letter-spacing:.22em;color:var(--ember);margin-bottom:14px}
h1{font-family:var(--serif);font-size:2rem;margin-bottom:12px}
p{color:var(--muted);margin-bottom:26px}
a.btn{display:inline-block;background:var(--ember);color:#181008;font-weight:700;padding:12px 24px;border-radius:10px;text-decoration:none}
a.btn:hover{background:var(--hot)}
</style>
</head>
<body>
<div class="card">
  <p class="eyebrow">404</p>
  <h1>This page is underbaked.</h1>
  <p>What you are looking for does not exist yet. The oven is still on, though.</p>
  <a class="btn" href="/bakery/">Back to the bakery</a>
</div>
</body>
